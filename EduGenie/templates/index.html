<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGenie - Your AI Learning Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1>Welcome to EduGenie 🧠✨</h1>
      <p class="tagline">Your personal AI tutor for learning support!</p>
    </header>

    <form id="eduForm" class="card" autocomplete="off">
      <label for="task"><strong>What would you like to do?</strong></label>
      <select id="task">
        <option value="qa">Ask a Question (Q&amp;A)</option>
        <option value="explain">Explain a Concept</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summary">Summarize Text</option>
        <option value="path">Recommend Learning Path</option>
      </select>

      <label for="userInput" id="inputLabel"><strong>Your question:</strong></label>
      <textarea id="userInput" rows="5" placeholder="Which is the largest ocean?" required></textarea>

      <button type="submit" id="submitBtn">Get Answer</button>
    </form>

    <section id="result" class="card result hidden" aria-live="polite">
      <h2 id="resultTitle"></h2>
      <div id="resultBody"></div>
    </section>

    <footer>EduGenie · Powered by Google Gemini</footer>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
